# global_loot.yml
# Баланс: "Золота середина" (Balanced RPG)
# Таблиця мусить покривати УСІ інгредієнти з custom-items.yml (звіряй із potion-recipes.yml —
# саме він каже, до якого шляху й Послідовності належить інгредієнт). Пропущений інгредієнт
# = зілля, яке неможливо зварити з луту. Тест: GlobalLootCoverageTest.
# Ваги за Послідовністю: 9→60, 8→40, 7→25, 6→12 (rare), 5→5 (rare);
# рецепти 45/30/15/8/4, зілля 10/6/3.
# Сумарна вага 5619 → шанс одного ролу: Seq 9 ~1.07%, Seq 5 ~0.09% (на 9 шляхів).

