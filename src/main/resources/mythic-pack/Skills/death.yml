# ── Кіт S9..S5: мобові версії гравцевих здібностей Death ──
# Смерть не краде й не дебафить розум ілюзією (Error) чи наказом (Justiciar) — вона тягне
# ціль ближче до потойбіччя: холод, гниття, тіні. Кожен щабель додає власний штрих
# (гниття S9 -> холод S8 -> лід медіума S7 -> тіні провідника S6 -> хватка воротаря S5).

# Наступальна: гниттьовий дотик трупозбирача (CadavericResilience/GloomyPresence, S9)
MA_Death_S9_Decay:
  Skills:
  - damage{amount=4}
  - potion{type=POISON;duration=60;level=0;particles=false}
  - effect:particles{p=squid_ink;amount=10;hS=0.3;vS=0.4;y=1;speed=0.02}
  - effect:sound{s=entity.zombie.infect;v=0.8;p=0.6}

