MA_Tyrant_S7_AzureWave_Hit:
  Skills:
  - damage{amount=6}
  - throw{velocity=5;velocityY=2}
  - effect:particles{p=splash;amount=24;hS=0.5;vS=0.5;y=1;speed=0.05}

