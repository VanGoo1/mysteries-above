# ── Кіт S9..S5: мобові версії гравцевих здібностей Tyrant ──
# Наступальна: морський випад — притягування з ударом (SeaLunge, S9)
MA_Tyrant_S9_SeaLunge:
  Skills:
  - damage{amount=5}
  - pull{velocity=1.0}
  - effect:particles{p=bubble;amount=14;hS=0.3;vS=0.5;y=1;speed=0.05}
  - effect:sound{s=entity.player.splash;v=1;p=0.8}

# Реактивна (поза ГКД): ілюзорна луска — резист при уроні (IllusoryScales, S9)
MA_Tyrant_S9_IllusoryScales:
  Cooldown: 12
  Skills:
  - potion{type=RESISTANCE;duration=50;level=0;particles=false} @self
  - effect:particles{p=glow;amount=12;hS=0.3;vS=0.5;y=1} @self

# Наступальна: шалений удар (RagingBlow, S8)
MA_Tyrant_S8_RagingBlow:
  Skills:
  - damage{amount=7}
  - throw{velocity=6;velocityY=2}
  - effect:particles{p=crit;amount=14;hS=0.3;vS=0.4;y=1;speed=0.2}
  - effect:sound{s=entity.ravager.attack;v=0.8;p=0.9}

# Реактивна (поза ГКД): лють — підсилення на низькому HP (Wrath, S8)
MA_Tyrant_S8_Wrath:
  Cooldown: 25
  Skills:
  - potion{type=STRENGTH;duration=120;level=1;particles=false} @self
