# Істоти Світу Духів — рід істот, що НЕ належать жодному шляху.
#
# Окремий файл із тієї ж причини, що й spirits.yml: Світ Духів не є власністю Смерті.
# Провідник духів (Death, Посл. 6) кличе їх перший, але вікі згадує тих самих істот і
# в інших контекстах, тож файл названо за родом істот, а не за шляхом-споживачем.
#
# Тег ma_spirit_world — спосіб упізнати їх як рід із коду: шар здібностей не має права
# торкатись MythicMobs API (ArchitectureTest.mythicMobsApiIsConfinedToBridgePackage). Другий
# тег — власний internal id — дає впізнати КОНКРЕТНУ істоту (ціна домовленості різна).
#
# Шаблону MA_<Pathway>_S<seq> немає навмисно: він існує, щоб нести кіт здібностей
# послідовності, а ці істоти кіту не мають.
#
# AITargetSelectors: тільки `0 clear` — істота НІКОЛИ не обирає ворога сама. Її ціль
# виставляє почет провідника (UndeadRetinueSession, наказ «убити ціль»), а рухові гоали
# лишаються ванільні, тож ближній бій по виставленій цілі працює. Це та сама «відсутність
# волі», що й у піднятих трупів.
#
# Ці істоти самі спавняться в Пеклі (creatures.yml, pathway: spirit-world) — гравець їх
# ЗНАХОДИТЬ, а Домовленість з духами (Death, Посл. 6) лише пропонує домовитись (shift-ПКМ).
# Незаявлена істота — звичайний ванільний despawn (Despawn у Options НЕ ставимо). Заявлену
# UndeadRetinueSession.enroll() робить setRemoveWhenFarAway(false) сама — тому й не деспавниться,
# поки її не вб'ють або поки почет не розпустять; прибирає її сесія
# (див. .claude/rules/summoned-creatures.md), а не таймер сервера.

# S1h. «A towering figure—a knight adorned in tattered black armor and a broadsword.
# Pale flames flicker in its eye sockets and putrid liquid seeps from its armor's crevices.»
death_knight:
  Type: WITHER_SKELETON
  Display: '&8Лицар Смерті'
  Health: 60
  Damage: 8
  Armor: 8
  # Слоти числами (0 — рука, 3 — нагрудник, 4 — шолом): формат, який MythicMobs розуміє
  # в усіх версіях, на відміну від іменованих HEAD/CHEST.
  Equipment:
  - IRON_SWORD:0
  - CHAINMAIL_CHESTPLATE:3
  - CHAINMAIL_HELMET:4
  AITargetSelectors:
  - 0 clear
  Options:
    PreventOtherDrops: true
    PreventRandomEquipment: true
    MaxCombatDistance: 32
    MovementSpeed: 0.24
    Scale: 1.2
    PreventSunburn: true
  Skills:
  - addtag{t=ma_spirit_world} @self ~onSpawn
  - addtag{t=death_knight} @self ~onSpawn
  - effect:particles{p=soul_fire_flame;amount=2;hS=0.2;vS=0.3;y=1.7;speed=0.01} @self ~onTimer:20
  - effect:particles{p=dripping_dripstone_lava;amount=1;hS=0.3;vS=0.4;y=1} @self ~onTimer:40

# S1g. «A decaying, skeletal python oozing yellowish-green pus… Its fangless mouth resembles
# a vortex… It can emit a suction force that tugs at the surrounding shadows, drawing them in.»
# «Витягування з тіні» в грі — світіння на всіх поблизу: сховане перестає бути схованим.
shadow_swallowing_python:
  Type: CAVE_SPIDER
  Display: '&2Пітон, що ковтає тіні'
  Health: 40
  Damage: 5
  AITargetSelectors:
  - 0 clear
  Options:
    PreventOtherDrops: true
    MaxCombatDistance: 32
    MovementSpeed: 0.32
    Scale: 1.4
  Skills:
  - addtag{t=ma_spirit_world} @self ~onSpawn
  - addtag{t=shadow_swallowing_python} @self ~onSpawn
  - potion{type=GLOWING;duration=80;level=0;particles=false} @PlayersInRadius{r=8} ~onTimer:80
  - effect:particles{p=sculk_soul;amount=6;hS=0.5;vS=0.2;y=0.4;speed=0.01} @self ~onTimer:20
  - effect:sound{s=entity.warden.sonic_charge;v=0.4;p=1.6} @self ~onTimer:120

